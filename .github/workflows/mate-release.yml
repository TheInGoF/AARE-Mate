# Mate's release from a version tag (v2.0.13), signed with Mate's key from the repository (signing/mate-release.enc,
# opened with the secret MATE_KEY_PASS, see mate-key.yml) - the same assets as the releases made at the build PC
# before: mate-<version>.apk, title "Mate <version>", for the Panel-Store. Without the key nothing is published
# (never a debug-signed APK). A release that exists already (made at the PC) is left as it is.
name: Mate release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 2.0.13 (the tag v<version> is made on the current commit)"
        required: true
      notes:
        description: "Release notes (German, short sentences or groups like 'Mate Navi: ...'); empty = docs/release-notes/<version>.md"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MATE_KEY_PASS: ${{ secrets.MATE_KEY_PASS }}
      MATE_KEY_ENC: ${{ secrets.MATE_KEY_ENC }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # from a tag push its name, started by hand v<version> (made by the release itself)
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Already released?
        id: there
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists, left as it is"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.there.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: steps.there.outputs.skip != 'true'
      - name: Build, sign, publish
        if: steps.there.outputs.skip != 'true'
        run: |
          set -eu
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Not a version: $TAG (v1.2.3)"; exit 1;; esac
          # the encrypted key from the secret MATE_KEY_ENC (base64 of signing/mate-release.enc; 20.11.2026, out of the
          # repository before it goes public), else from the file as before
          keyfile=signing/mate-release.enc
          if [ -n "${MATE_KEY_ENC:-}" ]; then keyfile="$RUNNER_TEMP/mate-release.enc"; printf '%s' "$MATE_KEY_ENC" | base64 -d > "$keyfile"; fi
          if [ -z "$MATE_KEY_PASS" ] || [ ! -f "$keyfile" ]; then
            echo "::error::No release key: set the secrets MATE_KEY_PASS and MATE_KEY_ENC (or run the workflow 'Mate key' once)"; exit 1; fi
          VERSION="${TAG#v}"
          # release notes: what changed, never only the version (L-072) - from the input, else from the file of the version
          notes="$RUNNER_TEMP/notes.md"
          if [ -n "${NOTES:-}" ]; then printf '%s\n' "$NOTES" > "$notes"
          elif [ -s "docs/release-notes/$VERSION.md" ]; then cp "docs/release-notes/$VERSION.md" "$notes"
          else echo "::error::No release notes: give the input 'notes' or add docs/release-notes/$VERSION.md"; exit 1; fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          work="$RUNNER_TEMP/key"; mkdir -p "$work"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:MATE_KEY_PASS -in "$keyfile" | tar -C "$work" -xf -
          set -a; . "$work/key.env"; set +a
          export AARE_KEYSTORE="$work/mate.jks"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          rm -rf "$work"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mate-$VERSION.apk"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Mate $VERSION" --notes-file "$notes" "out/mate-$VERSION.apk"
