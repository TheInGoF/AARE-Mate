name: Fehler / Bug
description: Etwas in Mate funktioniert nicht wie erwartet. / Something in Mate doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Mate ist ein Fork von AARE. Fehler in Mate bitte hier melden, nicht bei AARE.
        Mate is a fork of AARE. Please report Mate's problems here, not to AARE.
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert? / What happened?
      description: Was hast du getan, was hast du erwartet, was kam stattdessen? / What did you do, expect and get?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich / Area
      options: [Mate Navi, Dashboard, Mate Musik, Nachrichten / Messages, Anrufe / Calls, Kino / Cinema, Sprache / Speech, Verbindung / Connection, Telefon-App / Phone app, Anderes / Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mate-Version / Mate version
      description: Unten auf der Startseite der Telefon-App. / At the bottom of the phone app's start page.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Tablet und Android-Version / Tablet and Android version
  - type: textarea
    id: log
    attributes:
      label: Protokoll / Log
      description: |
        In der Telefon-App „Issue-Log speichern“ – diese Kopie ist ohne Positionen, Orte, Namen und Tokens.
        Bitte nie das vollständige Protokoll öffentlich anhängen.
        In the phone app "Save issue log" - that copy has no positions, places, names or tokens. Never attach the full log publicly.
      render: text
