# Keep Gradle small, so it builds on modest machines.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=3
org.gradle.daemon=false
# compile Kotlin inside the Gradle process (no separate Kotlin daemon)
kotlin.compiler.execution.strategy=in-process
org.gradle.java.installations.auto-download=false
# The JDK in JAVA_HOME (17-21; build.sh finds one) is the toolchain
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# The AARE this Mate stands on (github.com/prototux/AARE), shown in the app: the base it was made from, and the newest
# AARE release whose changes were looked through (docs/upstream.md lists what was taken over)
aareBase=1.4.0+58 (5d932ae, 10.11.2026)
aareSeen=1.5.0
